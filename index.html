<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0e0e10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Tomas</title>
<style>
:root{
  --bg:#0e0e10; --card:#1a1a1d; --line:#2a2a2e; --text:#f2f2f3; --muted:#8c8c93;
  --accent:#f2f2f3; --ok:#4ade80; --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.hidden{display:none!important}

/* ---------- grid screen ---------- */
#home{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
h1{font-size:22px;font-weight:600;margin:0;letter-spacing:-.3px}
h1 small{font-weight:400;color:var(--muted);font-size:14px;margin-left:6px}
.chips{display:flex;gap:8px;padding:4px 16px 12px;overflow-x:auto;scrollbar-width:none}
.chip{padding:7px 14px;border-radius:99px;background:var(--card);color:var(--muted);font-size:14px;white-space:nowrap}
.chip.on{background:var(--text);color:var(--bg)}
.chip.mode.on{background:var(--ok);color:#06210f}
#grid{flex:1;overflow-y:auto;padding:0 12px calc(96px + env(safe-area-inset-bottom));
  display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:calc((100vw - 40px) / 3);gap:8px;align-content:start}
.tile{position:relative;border-radius:var(--r);overflow:hidden;background:var(--card)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.tile .n{position:absolute;left:6px;top:6px;min-width:22px;height:22px;padding:0 6px;border-radius:99px;
  background:rgba(0,0,0,.55);font-size:12px;display:grid;place-items:center;backdrop-filter:blur(6px)}
.tile .note{position:absolute;right:6px;top:6px;width:8px;height:8px;border-radius:50%;background:#fbbf24}
.tile.done img{opacity:.35}
.tile.done::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;font-size:30px;color:var(--ok)}
.tile.sel{outline:3px solid var(--text);outline-offset:-3px}
.tile.target{opacity:.9}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:70px 20px}
.empty b{display:block;color:var(--text);font-size:18px;margin-bottom:6px}
.hint{grid-column:1/-1;text-align:center;font-size:13px;color:var(--muted);padding:2px 0 6px}

.fab{width:max-content;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));
  display:flex;gap:8px}
.pill{white-space:nowrap;height:50px;padding:0 22px;border-radius:99px;background:var(--text);color:var(--bg);font-weight:600;
  box-shadow:0 6px 24px rgba(0,0,0,.5);display:flex;align-items:center;gap:8px}
.pill.alt{background:var(--card);color:var(--text)}

/* ---------- viewer ---------- */
#viewer{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top);z-index:10}
.bar{display:flex;align-items:center;justify-content:space-between;padding:8px 8px}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;color:var(--muted)}
.count{color:var(--muted);font-size:15px}
#stage{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:pan-y;padding:0 12px;
  display:flex;align-items:center;justify-content:center}
#stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:var(--r);transition:transform .22s ease,opacity .22s ease;user-select:none;-webkit-user-drag:none}
#stage.dragging img{transition:none}
#stage .badge{position:absolute;right:22px;top:10px;background:var(--ok);color:#06210f;font-size:13px;font-weight:600;
  padding:4px 10px;border-radius:99px}
.panel{padding:10px 12px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
textarea{width:100%;resize:none;border:0;outline:0;border-radius:var(--r);background:var(--card);
  color:var(--text);font:inherit;font-size:16px;padding:12px 14px;height:64px}
textarea::placeholder{color:var(--muted)}
.row{display:flex;gap:8px;align-items:center}
.done-btn{flex:1;height:52px;border-radius:99px;background:var(--text);color:var(--bg);font-weight:600;font-size:17px}
.done-btn.is{background:var(--card);color:var(--ok)}
.nav{width:52px;height:52px;border-radius:50%;background:var(--card);font-size:20px;display:grid;place-items:center}
.nav:disabled{opacity:.3}
.tile .tags{position:absolute;left:6px;right:6px;bottom:6px;display:none;gap:4px;flex-wrap:wrap}
.tile .tags span{background:rgba(0,0,0,.6);backdrop-filter:blur(6px);font-size:11px;padding:2px 8px;border-radius:99px}
.chip.tag{background:transparent;border:1px solid var(--line)}
.chip.tag.on{background:var(--text);border-color:var(--text)}
.chip.tag small{opacity:.6;margin-left:4px}
.tagbar{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;min-height:34px}
.tagbar .t{display:flex;align-items:center;gap:6px;background:var(--text);color:var(--bg);border-radius:99px;
  padding:5px 6px 5px 12px;font-size:14px;white-space:nowrap}
.tagbar .t b{font-weight:400;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.15);display:grid;place-items:center;font-size:12px}
.tagbar input{flex:1;min-width:130px;border:0;outline:0;background:var(--card);color:var(--text);font:inherit;font-size:16px;
  padding:6px 14px;border-radius:99px;height:34px}
.tagbar input::placeholder{color:var(--muted)}
.sug{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.sug:empty{display:none}
.sug button{padding:4px 12px;border-radius:99px;border:1px dashed var(--line);color:var(--muted);font-size:13px;white-space:nowrap}
.size{display:none;width:110px;accent-color:#f2f2f3}
.tile.dragging{opacity:.35}
.tile.dl{box-shadow:-5px 0 0 var(--ok)}
.tile.dr{box-shadow:5px 0 0 var(--ok)}
#dropzone{position:fixed;inset:10px;border:2px dashed var(--ok);border-radius:var(--r);background:rgba(14,14,16,.85);
  display:grid;place-items:center;font-size:20px;z-index:40;pointer-events:none}

/* ---------- escritorio ---------- */
@media (min-width:800px){
  header{padding:18px 24px 10px}
  .chips{padding:4px 24px 12px}
  #grid{padding:0 24px 110px;grid-template-columns:repeat(auto-fill,minmax(var(--min,280px),1fr));gap:14px;grid-auto-rows:auto}
  .tile{aspect-ratio:16/9;cursor:grab}
  .tile img{object-fit:contain}
  .tile .tags{display:flex}
  .size{display:block}
  #viewer{display:grid;grid-template-columns:1fr 380px;grid-template-rows:auto 1fr;padding-top:0}
  #viewer .bar{grid-column:1/-1;padding:10px 16px}
  #stage{grid-row:2;padding:0 8px 24px 24px}
  .panel{grid-row:2;grid-column:2;padding:0 24px 24px 12px;justify-content:flex-start;overflow-y:auto}
  textarea{height:140px}
  .row{order:-1}
}
@media (pointer:fine){ #orderBtn{display:none} }
#grid{position:relative}
.tile.picked{outline:3px solid var(--ok);outline-offset:-3px}
.tile.picked::before{content:"✓";position:absolute;right:8px;top:8px;width:24px;height:24px;border-radius:50%;background:var(--ok);
  color:#06210f;display:grid;place-items:center;font-size:14px;font-weight:700;z-index:2}
.marq{position:absolute;border:1px solid var(--ok);background:rgba(74,222,128,.12);border-radius:6px;pointer-events:none;z-index:5}
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));display:flex;gap:10px;
  align-items:center;background:var(--card);border:1px solid var(--line);padding:8px 8px 8px 20px;border-radius:99px;
  box-shadow:0 6px 24px rgba(0,0,0,.5);z-index:15;white-space:nowrap}
.selbar input{width:160px;border:0;outline:0;background:var(--bg);color:var(--text);font:inherit;font-size:15px;padding:0 14px;border-radius:99px;height:36px}
.selbar input::placeholder{color:var(--muted)}
.selbar button{height:36px;padding:0 14px;border-radius:99px}
.selbar .danger{color:#f87171;background:rgba(248,113,113,.1)}
.selbar .x{width:36px;padding:0;background:var(--bg);color:var(--muted)}
#syncBtn.spin{animation:spin 1s linear infinite;color:var(--text)}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;top:calc(60px + env(safe-area-inset-top));transform:translateX(-50%);background:#2a2a2e;padding:10px 16px;
  border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#toast.show{opacity:1}
</style>
</head>
<body>

<div id="home">
  <header>
    <h1>Tomas <small id="progress"></small></h1>
    <div style="display:flex;gap:8px">
      <input type="range" class="size" id="size" min="160" max="560" step="10" title="Tamaño">
      <button class="chip hidden" id="syncBtn" aria-label="Sincronizar">↻</button>
      <button class="chip mode" id="orderBtn">Ordenar</button>
    </div>
  </header>
  <div class="chips" id="filters">
    <button class="chip on" data-f="all">Todas</button>
    <button class="chip" data-f="todo">Pendientes</button>
    <button class="chip" data-f="done">Hechas</button>
  </div>
  <div class="chips hidden" id="tagChips"></div>
  <div id="grid"></div>
  <div class="selbar hidden" id="selbar">
    <span id="selCount"></span>
    <input id="selTag" list="tagOpts" placeholder="Etiquetar…" autocomplete="off" autocapitalize="none">
    <button class="danger" id="selDel">Eliminar</button>
    <button class="x" id="selClear" aria-label="Deseleccionar">✕</button>
  </div>
  <div class="fab" id="fab">
    <button class="pill" id="addBtn">＋ Añadir fotos</button>
    <button class="pill alt hidden" id="startBtn">▶ Empezar</button>
  </div>
</div>

<div id="viewer" class="hidden">
  <div class="bar">
    <button class="ib" id="closeBtn" aria-label="Cerrar">✕</button>
    <span class="count" id="count"></span>
    <button class="ib" id="delBtn" aria-label="Borrar">🗑</button>
  </div>
  <div id="stage"><img id="bigImg" alt=""><span class="badge hidden" id="badge">Hecha</span></div>
  <div class="panel">
    <div class="tagbar" id="tagbar"></div>
    <div class="sug" id="sug"></div>
    <textarea id="noteTxt" placeholder="Anotación…"></textarea>
    <div class="row">
      <button class="nav" id="prevBtn" aria-label="Anterior">‹</button>
      <button class="done-btn" id="doneBtn">Marcar como hecha</button>
      <button class="nav" id="nextBtn" aria-label="Siguiente">›</button>
    </div>
  </div>
</div>

<input type="file" id="file" accept="image/*" multiple hidden>
<div id="toast"></div>
<div id="dropzone" class="hidden">Suelta las imágenes para añadirlas</div>
<datalist id="tagOpts"></datalist>

<script src="config.js"></script>
<script>
/* ---------- storage (IndexedDB) ---------- */
const DB = (() => {
  let db;
  const open = () => new Promise((res, rej) => {
    const r = indexedDB.open('tomas', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('items', { keyPath: 'id' });
    r.onsuccess = () => { db = r.result; res(); };
    r.onerror = () => rej(r.error);
  });
  const tx = (mode, fn) => new Promise((res, rej) => {
    const t = db.transaction('items', mode);
    const out = fn(t.objectStore('items'));
    t.oncomplete = () => res(out && out.result);
    t.onerror = () => rej(t.error);
  });
  return {
    open,
    all: () => tx('readonly', s => s.getAll()),
    put: items => tx('readwrite', s => { [].concat(items).forEach(i => s.put(i)); }),
    del: id => tx('readwrite', s => { s.delete(id); }),
  };
})();

/* ---------- state ---------- */
let items = [];          // sorted by order
let filter = 'all';
let ordering = false;
let tagFilter = new Set();
let sel = new Set();     // selección múltiple (escritorio)
let anchor = null;
let selectedId = null;   // item picked while ordering
let current = -1;        // index in visible list while in viewer
const urls = new Map();  // id -> {thumb, full}

const $ = id => document.getElementById(id);
const byId = id => items.find(i => i.id === id);
const visible = () => items.filter(i =>
  (filter === 'all' || (filter === 'done') === i.done) &&
  (!tagFilter.size || (i.tags || []).some(t => tagFilter.has(t))));
const allTags = () => {
  const m = new Map();
  items.forEach(i => (i.tags || []).forEach(t => m.set(t, (m.get(t) || 0) + 1)));
  return [...m].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
};
const FINE = matchMedia('(pointer:fine)').matches;
const esc = t => t.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const url = (i, k) => {
  let u = urls.get(i.id) || {};
  if (!u[k]) u[k] = URL.createObjectURL(i[k]);
  urls.set(i.id, u);
  return u[k];
};
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ---------- image import ---------- */
async function load(file) {
  if (window.createImageBitmap) {
    try { return await createImageBitmap(file); } catch (e) {}
  }
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => { res(img); };
    img.onerror = rej; img.src = u;
  });
}
function scaled(src, max, q) {
  const w = src.width, h = src.height, k = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas');
  c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, 'image/jpeg', q));
}
async function addFiles(files) {
  const list = [...files].sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
  let n = 0, base = items.length ? Math.max(...items.map(i => i.order)) + 1 : 0;
  const added = [];
  for (const f of list) {
    toast(`Importando ${++n}/${list.length}…`);
    try {
      const src = await load(f);
      const item = {
        id: crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + n,
        order: base++, done: false, note: '', tags: [], dirty: true, uploaded: false, v: 0,
        full: await scaled(src, 2400, 0.9),
        thumb: await scaled(src, 640, 0.82),
      };
      added.push(item);
    } catch (e) { toast('No pude leer ' + f.name); }
  }
  if (added.length) { await DB.put(added); items.push(...added); }
  render();
  toast(`${added.length} añadidas`);
  scheduleSync(300);
}

/* ---------- grid ---------- */
function render() {
  const g = $('grid'), vis = visible();
  g.innerHTML = '';
  const done = items.filter(i => i.done).length;
  $('progress').textContent = items.length ? `${done}/${items.length}` : '';
  $('startBtn').classList.toggle('hidden', !items.length || ordering);
  $('orderBtn').classList.toggle('on', ordering);
  $('orderBtn').textContent = ordering ? 'Listo' : 'Ordenar';
  $('orderBtn').classList.toggle('hidden', items.length < 2);
  if (!items.length) {
    g.innerHTML = '<div class="empty"><b>Sin referencias todavía</b>Añade tus stills para empezar.</div>';
    return;
  }
  if (ordering) {
    const h = document.createElement('div'); h.className = 'hint';
    h.textContent = selectedId ? 'Toca dónde quieres ponerla' : 'Toca una foto para moverla';
    g.appendChild(h);
  }
  if (!vis.length) {
    g.insertAdjacentHTML('beforeend', '<div class="empty">Nada aquí.</div>');
  }
  vis.forEach((it, idx) => {
    const d = document.createElement('div');
    d.className = 'tile' + (it.done ? ' done' : '') + (it.id === selectedId ? ' sel' : '') + (sel.has(it.id) ? ' picked' : '');
    d.dataset.id = it.id;
    d.innerHTML = `<img src="${url(it, DESK ? 'full' : 'thumb')}" alt=""${DESK ? ' loading="lazy"' : ''}><span class="n">${items.indexOf(it) + 1}</span>` +
      (it.note ? '<span class="note"></span>' : '') +
      ((it.tags || []).length ? `<div class="tags">${it.tags.map(t => `<span>${esc(t)}</span>`).join('')}</div>` : '');
    d.onclick = e => {
      if (ordering) return tapOrder(it);
      if (FINE && (e.metaKey || e.ctrlKey)) { sel.has(it.id) ? sel.delete(it.id) : sel.add(it.id); anchor = it.id; return paintSel(); }
      if (FINE && e.shiftKey) {
        const ids = visible().map(x => x.id), a = ids.indexOf(anchor), b = ids.indexOf(it.id);
        if (a < 0) { sel.add(it.id); anchor = it.id; }
        else ids.slice(Math.min(a, b), Math.max(a, b) + 1).forEach(id => sel.add(id));
        return paintSel();
      }
      if (sel.size) { sel.clear(); paintSel(); }
      openViewer(idx);
    };
    const im = d.querySelector('img'), k = DESK ? 'full' : 'thumb';
    im.onerror = () => { // blob inválido o URL revocada: reintenta y, si no, usa la nube
      if (!im.dataset.r) { im.dataset.r = 1; const u = urls.get(it.id); if (u) delete u[k]; im.src = url(it, k); }
      else if (SYNC && !im.dataset.c) { im.dataset.c = 1; im.src = pubUrl(it.id, k === 'full' ? 'full' : 'thumb'); }
    };
    if (FINE) wireDrag(d, it);
    g.appendChild(d);
  });
  renderTagChips();
  paintSel();
}
function paintSel() {
  [...sel].forEach(id => { if (!byId(id)) sel.delete(id); });
  document.querySelectorAll('#grid .tile').forEach(t => t.classList.toggle('picked', sel.has(t.dataset.id)));
  const n = sel.size;
  $('selbar').classList.toggle('hidden', !n); $('fab').classList.toggle('hidden', !!n);
  $('selCount').textContent = n + (n === 1 ? ' seleccionada' : ' seleccionadas');
}
const DESK = matchMedia('(min-width:800px)').matches;
function renderTagChips() {
  const tags = allTags(), box = $('tagChips');
  [...tagFilter].forEach(t => { if (!tags.some(x => x[0] === t)) tagFilter.delete(t); });
  box.classList.toggle('hidden', !tags.length);
  box.innerHTML = tags.map(([t, n]) =>
    `<button class="chip tag${tagFilter.has(t) ? ' on' : ''}" data-t="${esc(t)}">${esc(t)}<small>${n}</small></button>`).join('');
  box.querySelectorAll('.chip').forEach(c => c.onclick = () => {
    const t = c.dataset.t;
    tagFilter.has(t) ? tagFilter.delete(t) : tagFilter.add(t);
    render();
  });
  $('tagOpts').innerHTML = tags.map(([t]) => `<option value="${esc(t)}">`).join('');
}

/* drag & drop (ratón): arrastra una foto o toda la selección */
let dragIds = null;
function wireDrag(d, it) {
  d.draggable = true;
  const side = e => { const r = d.getBoundingClientRect(); return e.clientX > r.left + r.width / 2; };
  d.ondragstart = e => {
    dragIds = sel.has(it.id) ? [...sel] : [it.id];
    e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', it.id);
    if (dragIds.length > 1) {
      const g = document.createElement('div'); g.textContent = dragIds.length + ' fotos';
      g.style.cssText = 'position:fixed;top:-100px;padding:8px 14px;border-radius:99px;background:#f2f2f3;color:#0e0e10;font:600 14px system-ui';
      document.body.appendChild(g); e.dataTransfer.setDragImage(g, 20, 16); setTimeout(() => g.remove());
    }
    requestAnimationFrame(() => document.querySelectorAll('#grid .tile').forEach(t => t.classList.toggle('dragging', dragIds.includes(t.dataset.id))));
  };
  d.ondragend = () => { dragIds = null; document.querySelectorAll('.tile').forEach(t => t.classList.remove('dragging', 'dl', 'dr')); };
  d.ondragover = e => {
    if (!dragIds || dragIds.includes(it.id)) return;
    e.preventDefault(); const a = side(e);
    d.classList.toggle('dr', a); d.classList.toggle('dl', !a);
  };
  d.ondragleave = () => d.classList.remove('dl', 'dr');
  d.ondrop = e => {
    if (!dragIds || dragIds.includes(it.id)) return;
    e.preventDefault(); const a = side(e), ids = dragIds; dragIds = null;
    moveTo(ids, it.id, a);
  };
}
async function moveTo(ids, targetId, after) {
  const set = new Set(ids);
  if (set.has(targetId)) return;
  const moving = items.filter(i => set.has(i.id));
  items = items.filter(i => !set.has(i.id));
  const t = items.findIndex(i => i.id === targetId);
  items.splice(after ? t + 1 : t, 0, ...moving);
  await saveOrder(); render();
}

/* marco de selección con el ratón */
$('grid').addEventListener('mousedown', e => {
  const g = $('grid');
  if (!FINE || e.button !== 0 || e.target !== g) return;
  e.preventDefault();
  const add = e.shiftKey || e.metaKey || e.ctrlKey, base = new Set(add ? sel : []);
  const gr = g.getBoundingClientRect();
  const x0 = e.clientX - gr.left + g.scrollLeft, y0 = e.clientY - gr.top + g.scrollTop;
  if (!add && sel.size) { sel.clear(); paintSel(); }
  let box = null, lastX = e.clientX, lastY = e.clientY, raf;
  const update = () => {
    const r = g.getBoundingClientRect();
    const x1 = lastX - r.left + g.scrollLeft, y1 = lastY - r.top + g.scrollTop;
    if (!box && Math.hypot(x1 - x0, y1 - y0) < 5) return;
    if (!box) { box = document.createElement('div'); box.className = 'marq'; g.appendChild(box); }
    const L = Math.min(x0, x1), T = Math.min(y0, y1), R = Math.max(x0, x1), B = Math.max(y0, y1);
    Object.assign(box.style, { left: L + 'px', top: T + 'px', width: R - L + 'px', height: B - T + 'px' });
    sel = new Set(base);
    g.querySelectorAll('.tile').forEach(t => {
      if (t.offsetLeft < R && t.offsetLeft + t.offsetWidth > L && t.offsetTop < B && t.offsetTop + t.offsetHeight > T) sel.add(t.dataset.id);
    });
    paintSel();
  };
  const tick = () => { // desplazamiento automático cerca de los bordes
    const r = g.getBoundingClientRect();
    if (lastY > r.bottom - 50) g.scrollTop += 16; else if (lastY < r.top + 50) g.scrollTop -= 16;
    update(); raf = requestAnimationFrame(tick);
  };
  const move = ev => { lastX = ev.clientX; lastY = ev.clientY; };
  const up = () => {
    cancelAnimationFrame(raf); removeEventListener('mousemove', move); removeEventListener('mouseup', up);
    if (box) box.remove();
  };
  addEventListener('mousemove', move); addEventListener('mouseup', up);
  raf = requestAnimationFrame(tick);
});
async function tapOrder(it) {
  if (!selectedId) { selectedId = it.id; return render(); }
  if (selectedId === it.id) { selectedId = null; return render(); }
  const id = selectedId;
  selectedId = null;
  await moveTo([id], it.id, items.findIndex(i => i.id === id) < items.indexOf(it));
}
async function saveOrder() {
  const ch = [];
  items.forEach((i, k) => { if (i.order !== k) { i.order = k; i.v = (i.v || 0) + 1; i.dirty = true; ch.push(i); } });
  if (ch.length) await DB.put(ch);
  scheduleSync();
}

/* ---------- viewer ---------- */
function openViewer(idx) {
  current = idx;
  $('viewer').classList.remove('hidden');
  showCurrent();
}
function closeViewer() {
  saveNote();
  $('viewer').classList.add('hidden');
  current = -1; render();
  if (pendingPull) scheduleSync(200);
}
function cur() { return visible()[current]; }
function showCurrent(dir = 0) {
  const vis = visible(), it = vis[current];
  if (!it) return closeViewer();
  const img = $('bigImg');
  const apply = () => {
    img.src = url(it, 'full');
    img.style.transition = 'none';
    img.style.transform = dir ? `translateX(${dir * 40}%)` : '';
    img.style.opacity = dir ? 0 : 1;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      img.style.transition = ''; img.style.transform = ''; img.style.opacity = 1;
    }));
  };
  apply();
  $('count').textContent = `${items.indexOf(it) + 1} / ${items.length}`;
  $('noteTxt').value = it.note;
  renderTagEditor(it);
  $('badge').classList.toggle('hidden', !it.done);
  const d = $('doneBtn');
  d.classList.toggle('is', it.done);
  d.textContent = it.done ? '✓ Hecha · deshacer' : 'Marcar como hecha';
  $('prevBtn').disabled = current === 0;
  $('nextBtn').disabled = current >= vis.length - 1;
}
function go(step) {
  saveNote();
  const n = current + step;
  if (n < 0 || n >= visible().length) return;
  current = n; showCurrent(step);
}
function renderTagEditor(it) {
  const mine = it.tags || [];
  const bar = $('tagbar');
  bar.innerHTML = mine.map(t => `<span class="t">${esc(t)}<b data-x="${esc(t)}">✕</b></span>`).join('') +
    '<input id="tagIn" list="tagOpts" placeholder="Etiqueta…" enterkeyhint="done" autocomplete="off" autocapitalize="none">';
  bar.querySelectorAll('b').forEach(b => b.onclick = () => setTags(it, mine.filter(t => t !== b.dataset.x)));
  const inp = $('tagIn');
  const commit = () => { const v = inp.value.trim().toLowerCase().replace(/,/g, ''); inp.value = ''; if (v) addTag(it, v); };
  inp.onkeydown = e => { if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); commit(); } };
  inp.oninput = e => { // elegir una opción del desplegable
    if (e.inputType === 'insertReplacementText' || e.inputType === undefined) commit();
  };
  inp.onblur = commit;
  $('sug').innerHTML = allTags().map(([t]) => t).filter(t => !mine.includes(t))
    .map(t => `<button data-t="${esc(t)}">+ ${esc(t)}</button>`).join('');
  $('sug').querySelectorAll('button').forEach(b => b.onclick = () => addTag(it, b.dataset.t));
}
function addTag(it, t) {
  const mine = it.tags || [];
  if (!mine.includes(t)) setTags(it, [...mine, t]);
}
function setTags(it, tags) {
  it.tags = tags; markDirty(it); renderTagEditor(it);
}
async function saveNote() {
  const it = cur(); if (!it || current < 0) return;
  const v = $('noteTxt').value.trim();
  if (v !== it.note) { it.note = v; markDirty(it); }
}
async function toggleDone() {
  const it = cur(); await saveNote();
  it.done = !it.done; markDirty(it);
  if (it.done) {
    // advance to the next pending shot (in the visible list, then wrap)
    const vis = visible();
    if (filter === 'todo') { // item leaves the list
      if (!vis.length) return closeViewer();
      current = Math.min(current, vis.length - 1); return showCurrent(1);
    }
    const next = vis.findIndex((x, k) => k > current && !x.done);
    if (next >= 0) { current = next; return showCurrent(1); }
  }
  showCurrent();
}
async function deleteItems(list) {
  for (const it of list) {
    await DB.del(it.id);
    if (it.uploaded) setDel([...getDel(), it.id]);
    items.splice(items.indexOf(it), 1); sel.delete(it.id);
    const u = urls.get(it.id); if (u) Object.values(u).forEach(URL.revokeObjectURL); urls.delete(it.id);
  }
  scheduleSync(300);
  await saveOrder();
}
async function deleteSelected() {
  const list = items.filter(i => sel.has(i.id));
  if (!list.length || !confirm(`¿Borrar ${list.length} ${list.length === 1 ? 'imagen' : 'imágenes'}?`)) return;
  await deleteItems(list); render();
}
function tagSelected(raw) {
  const t = raw.trim().toLowerCase().replace(/,/g, ''); if (!t) return;
  items.filter(i => sel.has(i.id) && !(i.tags || []).includes(t)).forEach(i => { i.tags = [...(i.tags || []), t]; markDirty(i); });
  render();
}
async function deleteCurrent() {
  const it = cur(); if (!it || !confirm('¿Borrar esta imagen?')) return;
  await deleteItems([it]);
  const vis = visible();
  if (!vis.length) return closeViewer();
  current = Math.min(current, vis.length - 1); showCurrent();
}

/* swipe */
(() => {
  const st = $('stage'); let x0 = null, y0 = 0, dx = 0;
  st.addEventListener('touchstart', e => {
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; st.classList.add('dragging');
  }, { passive: true });
  st.addEventListener('touchmove', e => {
    if (x0 === null) return;
    dx = e.touches[0].clientX - x0;
    if (Math.abs(dx) > Math.abs(e.touches[0].clientY - y0)) $('bigImg').style.transform = `translateX(${dx}px)`;
  }, { passive: true });
  st.addEventListener('touchend', () => {
    st.classList.remove('dragging'); $('bigImg').style.transform = '';
    if (x0 !== null && Math.abs(dx) > 60) go(dx < 0 ? 1 : -1);
    x0 = null;
  });
})();

/* ---------- sync (Supabase, opcional: ver config.js) ---------- */
const CFG = window.SUPABASE || {};
const SYNC = !!(CFG.url && CFG.key);
const sb = (path, opt = {}) => fetch(CFG.url + path, { ...opt, headers: { apikey: CFG.key, ...(opt.headers || {}) } });
const pubUrl = (id, k) => `${CFG.url}/storage/v1/object/public/stills/${id}/${k}.jpg`;
const okr = async r => { if (!r.ok) throw new Error(await r.text()); return r; };
const getDel = () => { try { return JSON.parse(localStorage.getItem('pendingDel') || '[]'); } catch (e) { return []; } };
const setDel = a => { try { localStorage.setItem('pendingDel', JSON.stringify(a)); } catch (e) {} };
const viewerOpen = () => !$('viewer').classList.contains('hidden');
let tagsWarned = false, syncing = false, syncAgain = false, pendingPull = false, syncTimer;

function markDirty(it) {
  it.v = (it.v || 0) + 1; it.dirty = true;
  DB.put(it); scheduleSync();
}
function scheduleSync(ms = 1500) {
  if (!SYNC) return;
  clearTimeout(syncTimer); syncTimer = setTimeout(sync, ms);
}
async function sync(manual) {
  if (!SYNC) return;
  if (syncing) { syncAgain = true; return; }
  syncing = true; $('syncBtn').classList.add('spin');
  try {
    // 1. borrados pendientes
    for (const id of getDel()) {
      await okr(await sb('/storage/v1/object/stills', { method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prefixes: [`${id}/full.jpg`, `${id}/thumb.jpg`] }) }));
      await okr(await sb(`/rest/v1/items?id=eq.${id}`, { method: 'DELETE' }));
      setDel(getDel().filter(x => x !== id));
    }
    // 2. subir lo nuevo o cambiado
    const sent = [];
    for (const it of items.filter(i => i.dirty || !i.uploaded)) {
      const v = it.v;
      if (!it.uploaded) {
        toast('Subiendo…');
        for (const k of ['full', 'thumb']) {
          await okr(await sb(`/storage/v1/object/stills/${it.id}/${k}.jpg`, { method: 'POST',
            headers: { 'Content-Type': 'image/jpeg', 'x-upsert': 'true' }, body: it[k] }));
        }
        it.uploaded = true;
      }
      sent.push([it, v]);
    }
    if (sent.length) {
      const post = withTags => sb('/rest/v1/items', { method: 'POST',
        headers: { 'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates,return=minimal' },
        body: JSON.stringify(sent.map(([i]) => ({ id: i.id, position: i.order, done: i.done, note: i.note,
          ...(withTags ? { tags: i.tags || [] } : {}) }))) });
      let res = await post(true), tagsFailed = false;
      if (!res.ok) {
        const msg = await res.text();
        if (!/tags/.test(msg)) throw new Error(msg);
        tagsFailed = true; // falta la columna en Supabase: seguimos sin etiquetas
        if (!tagsWarned) { tagsWarned = true; toast('Falta la columna de etiquetas en Supabase (ver supabase.sql)'); }
        res = await post(false);
      }
      await okr(res);
      for (const [it, v] of sent) if (it.v === v && !(tagsFailed && (it.tags || []).length)) it.dirty = false;
      await DB.put(sent.map(([i]) => i));
    }
    // 3. traer lo que haya en la nube
    if (viewerOpen()) pendingPull = true;
    else { pendingPull = false; await pull(); }
    if (manual === true) toast('Sincronizado');
  } catch (e) {
    console.error(e);
    toast(navigator.onLine ? 'Error al sincronizar' : 'Sin conexión');
  } finally {
    syncing = false; $('syncBtn').classList.remove('spin');
    if (syncAgain) { syncAgain = false; scheduleSync(300); }
  }
}
async function pull() {
  const rows = await (await okr(await sb('/rest/v1/items?select=*&order=position'))).json();
  const remote = new Map(rows.map(r => [r.id, r]));
  const changed = [];
  for (const it of [...items]) {
    const r = remote.get(it.id);
    if (!r) {
      if (!it.dirty) { // borrada desde otro dispositivo
        await DB.del(it.id);
        const u = urls.get(it.id); if (u) Object.values(u).forEach(URL.revokeObjectURL); urls.delete(it.id);
        items.splice(items.indexOf(it), 1);
      }
      continue;
    }
    const rt = r.tags === undefined ? (it.tags || []) : r.tags;
    if (!it.dirty && (it.order !== r.position || it.done !== r.done || it.note !== (r.note || '') ||
        JSON.stringify(it.tags || []) !== JSON.stringify(rt))) {
      Object.assign(it, { order: r.position, done: r.done, note: r.note || '', tags: rt }); changed.push(it);
    }
  }
  const fresh = rows.filter(r => !byId(r.id));
  let n = 0;
  for (const r of fresh) {
    toast(`Descargando ${++n}/${fresh.length}…`);
    try {
      const [full, thumb] = await Promise.all(['full', 'thumb'].map(async k => new Blob([await (await okr(await fetch(pubUrl(r.id, k)))).arrayBuffer()], { type: 'image/jpeg' })));
      const it = { id: r.id, order: r.position, done: r.done, note: r.note || '', tags: r.tags || [], full, thumb, dirty: false, uploaded: true, v: 0 };
      items.push(it); changed.push(it);
    } catch (e) { console.error(e); }
  }
  items.sort((a, b) => a.order - b.order);
  if (changed.length) await DB.put(changed);
  render();
}

/* ---------- wiring ---------- */
$('addBtn').onclick = () => $('file').click();
$('file').onchange = e => { addFiles(e.target.files); e.target.value = ''; };
$('startBtn').onclick = () => {
  const vis = visible(); if (!vis.length) return;
  const first = vis.findIndex(i => !i.done);
  openViewer(first >= 0 ? first : 0);
};
$('orderBtn').onclick = () => {
  ordering = !ordering; selectedId = null;
  if (ordering && filter !== 'all') setFilter('all'); else render();
};
function setFilter(f) {
  filter = f;
  document.querySelectorAll('#filters .chip').forEach(c => c.classList.toggle('on', c.dataset.f === f));
  render();
}
document.querySelectorAll('#filters .chip').forEach(c => c.onclick = () => {
  if (ordering && c.dataset.f !== 'all') return toast('Termina de ordenar primero');
  setFilter(c.dataset.f);
});
$('closeBtn').onclick = closeViewer;
$('selDel').onclick = deleteSelected;
$('selClear').onclick = () => { sel.clear(); paintSel(); };
{
  const inp = $('selTag');
  const go = () => { tagSelected(inp.value); inp.value = ''; };
  inp.onkeydown = e => { if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); go(); } };
  inp.oninput = e => { if (e.inputType === 'insertReplacementText' || e.inputType === undefined) go(); };
}
document.addEventListener('keydown', e => {
  if (!$('viewer').classList.contains('hidden') || ['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;
  if (e.key === 'Escape') { sel.clear(); paintSel(); }
  else if ((e.key === 'Delete' || e.key === 'Backspace') && sel.size) { e.preventDefault(); deleteSelected(); }
  else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'a' && FINE) { e.preventDefault(); visible().forEach(i => sel.add(i.id)); paintSel(); }
});
{ // tamaño de miniaturas (escritorio)
  const sz = $('size');
  try { const v = localStorage.getItem('size'); if (v) sz.value = v; } catch (e) {}
  const apply = () => $('grid').style.setProperty('--min', sz.value + 'px');
  sz.oninput = () => { apply(); try { localStorage.setItem('size', sz.value); } catch (e) {} };
  apply();
}
{ // arrastrar archivos desde el ordenador
  const dz = $('dropzone'); let depth = 0;
  const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
  addEventListener('dragenter', e => { if (hasFiles(e)) { depth++; dz.classList.remove('hidden'); } });
  addEventListener('dragleave', e => { if (hasFiles(e) && --depth <= 0) { depth = 0; dz.classList.add('hidden'); } });
  addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
  addEventListener('drop', e => {
    if (!hasFiles(e)) return;
    e.preventDefault(); depth = 0; dz.classList.add('hidden');
    const f = [...e.dataTransfer.files].filter(x => x.type.startsWith('image/'));
    if (f.length) addFiles(f);
  });
}
if (SYNC) {
  $('syncBtn').classList.remove('hidden');
  $('syncBtn').onclick = () => sync(true);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) scheduleSync(300); });
  window.addEventListener('online', () => scheduleSync(300));
}
$('prevBtn').onclick = () => go(-1);
$('nextBtn').onclick = () => go(1);
$('doneBtn').onclick = toggleDone;
$('delBtn').onclick = deleteCurrent;
$('noteTxt').addEventListener('blur', saveNote);
document.addEventListener('keydown', e => {
  if ($('viewer').classList.contains('hidden') || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight') go(1); if (e.key === 'ArrowLeft') go(-1); if (e.key === 'Escape') closeViewer();
});

(async () => {
  try {
    await DB.open();
    items = (await DB.all()).sort((a, b) => a.order - b.order);
    items.forEach(i => { i.tags = i.tags || []; });
    const fix = [];
    items.forEach(i => ['full', 'thumb'].forEach(k => {
      if (i[k] && i[k].type !== 'image/jpeg') { i[k] = new Blob([i[k]], { type: 'image/jpeg' }); if (!fix.includes(i)) fix.push(i); }
    }));
    if (fix.length) await DB.put(fix);
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  } catch (e) { toast('No se pudo abrir el almacenamiento'); }
  render();
  scheduleSync(100);
})();
</script>
